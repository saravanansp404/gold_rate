name: Update Prices

on:
  schedule:
    # India time (IST / Asia/Kolkata): every day 10:02 AM
    # GitHub Actions cron uses UTC only → 10:02 IST = 04:32 UTC
    - cron: "32 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    name: Scrape gold & fuel prices and commit JSON
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gold price scraper
        run: python scraper.py

      - name: Run petrol & diesel price scraper
        run: python fuel_scraper.py

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- gold_price.json fuel_price.json; then
            echo "No price changes to commit."
            exit 0
          fi

          git add gold_price.json fuel_price.json
          git commit -m "chore: update gold and fuel prices for $(date -u +%Y-%m-%d)"
          git push
